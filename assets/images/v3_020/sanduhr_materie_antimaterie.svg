<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800">
  <title>Sanduhr-Geometrie: Punktspiegelung am Ursprung — Farbe = Achse, Richtung = Materie/Antimaterie</title>

  <rect width="700" height="800" fill="#fafafa"/>

  <!-- Titel -->
  <text x="350" y="38" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#222">Sanduhr-Geometrie der Farbladungen</text>
  <text x="350" y="60" text-anchor="middle" font-family="serif" font-size="13" fill="#444">
    <tspan font-style="italic">Farbe</tspan> bestimmt die Achse ·
    <tspan font-style="italic">Richtung</tspan> (oben/unten) bestimmt Materie/Antimaterie
  </text>
  <text x="350" y="78" text-anchor="middle" font-family="serif" font-size="12" fill="#666">Jede Farbe + Anti-Farbe bilden EINE Linie der Länge 2L₀ durch das Zentrum</text>

  <!-- ===== KOORDINATEN-Setup =====
       Zentrum: (350, 400)
       Distanz zu Vertex: 200
       Punktspiegelung: jeder Materie-Vertex hat seinen Anti-Partner DIAGONAL gegenüber durchs Zentrum
  -->

  <!-- Drei Farb-Achsen als durchgehende Linien durch das Zentrum -->
  <!-- Rot-Achse: P1 (oben-rechts) ↔ P2 (unten-links) -->
  <line x1="500" y1="280" x2="200" y2="520" stroke="#cc0000" stroke-width="4" opacity="0.8"/>
  <!-- Grün-Achse: P3 (oben-links) ↔ P4 (unten-rechts) -->
  <line x1="200" y1="280" x2="500" y2="520" stroke="#00aa00" stroke-width="4" opacity="0.8"/>
  <!-- Blau-Achse: P5 (oben-mitte) ↔ P6 (unten-mitte) -->
  <line x1="350" y1="170" x2="350" y2="630" stroke="#0066ff" stroke-width="4" opacity="0.8"/>

  <!-- Hilfs-Tetraeder-Kanten (gestrichelt, weniger prominent) -->
  <!-- Oberer Tetraeder (Materie) -->
  <line x1="500" y1="280" x2="200" y2="280" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="500" y1="280" x2="350" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="200" y1="280" x2="350" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Spitze nach unten zum Ursprung -->
  <line x1="500" y1="280" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="200" y1="280" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="170" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Unterer Tetraeder (Antimaterie) — Punktspiegelung -->
  <line x1="200" y1="520" x2="500" y2="520" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="200" y1="520" x2="350" y2="630" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="500" y1="520" x2="350" y2="630" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Spitze nach oben zum Ursprung -->
  <line x1="200" y1="520" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="500" y1="520" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="630" x2="350" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Materie-Hintergrund-Halo OBEN -->
  <rect x="100" y="100" width="500" height="220" fill="#e8f5e9" opacity="0.3" rx="20"/>
  <text x="350" y="115" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" font-weight="bold" fill="#155724">MATERIE-Hemisphäre (positive Achsen)</text>

  <!-- Antimaterie-Hintergrund-Halo UNTEN -->
  <rect x="100" y="480" width="500" height="220" fill="#fce4ec" opacity="0.3" rx="20"/>
  <text x="350" y="700" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" font-weight="bold" fill="#880e4f">ANTIMATERIE-Hemisphäre (negative Achsen)</text>

  <!-- ===== VERTICES — mit Punktspiegelung am Ursprung ===== -->
  <!-- P5 oben mitte (z+ Blau Materie) -->
  <circle cx="350" cy="170" r="16" fill="#0066ff" stroke="#003a99" stroke-width="2.5"/>
  <text x="370" y="166" font-family="sans-serif" font-size="15" font-weight="bold" fill="#003a99">P₅ Blau (+z)</text>
  <text x="370" y="183" font-family="sans-serif" font-size="11" fill="#003a99">(0, 0, +L₀)</text>

  <!-- P6 unten mitte (z- Anti-Blau) — DIRECT spiegelung am Ursprung des P5 (vertikal OK) -->
  <circle cx="350" cy="630" r="16" fill="#aaccff" stroke="#0066ff" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="370" y="640" font-family="sans-serif" font-size="14" fill="#0066ff">P₆ Anti-Blau (−z)</text>
  <text x="370" y="657" font-family="sans-serif" font-size="11" fill="#0066ff">(0, 0, −L₀)</text>

  <!-- P1 oben rechts (x+ Rot Materie) -->
  <circle cx="500" cy="280" r="16" fill="#cc0000" stroke="#660000" stroke-width="2.5"/>
  <text x="520" y="276" font-family="sans-serif" font-size="15" font-weight="bold" fill="#660000">P₁ Rot (+x)</text>
  <text x="520" y="293" font-family="sans-serif" font-size="11" fill="#660000">(+L₀, 0, 0)</text>

  <!-- P2 unten LINKS (x- Anti-Rot) — PUNKTSPIEGELUNG! diagonal gegenüber P1 -->
  <circle cx="200" cy="520" r="16" fill="#ffaaaa" stroke="#cc0000" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="20" y="524" font-family="sans-serif" font-size="14" fill="#cc0000">P₂ Anti-Rot (−x)</text>
  <text x="20" y="541" font-family="sans-serif" font-size="11" fill="#cc0000">(−L₀, 0, 0)</text>

  <!-- P3 oben LINKS (y+ Grün Materie) -->
  <circle cx="200" cy="280" r="16" fill="#00aa00" stroke="#003a00" stroke-width="2.5"/>
  <text x="20" y="276" font-family="sans-serif" font-size="15" font-weight="bold" fill="#003a00">P₃ Grün (+y)</text>
  <text x="20" y="293" font-family="sans-serif" font-size="11" fill="#003a00">(0, +L₀, 0)</text>

  <!-- P4 unten RECHTS (y- Anti-Grün) — PUNKTSPIEGELUNG! diagonal gegenüber P3 -->
  <circle cx="500" cy="520" r="16" fill="#aaeeaa" stroke="#00aa00" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="520" y="524" font-family="sans-serif" font-size="14" fill="#00aa00">P₄ Anti-Grün (−y)</text>
  <text x="520" y="541" font-family="sans-serif" font-size="11" fill="#00aa00">(0, −L₀, 0)</text>

  <!-- ===== URSPRUNG (Mitte der Sanduhr / Schnittpunkt aller drei Farb-Linien) ===== -->
  <circle cx="350" cy="400" r="14" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="350" cy="400" r="6" fill="#000"/>
  <text x="370" y="396" font-family="serif" font-size="16" font-weight="bold" fill="#000">o = (0, 0, 0)</text>
  <text x="370" y="414" font-family="serif" font-size="12" font-style="italic" fill="#444">Mitte der Sanduhr</text>
  <text x="370" y="430" font-family="serif" font-size="11" fill="#666">Materie-/Antimaterie-Schnittpunkt</text>

  <!-- ===== Legende ===== -->
  <g transform="translate(40, 745)">
    <rect width="20" height="3" y="6" fill="#cc0000"/>
    <text x="28" y="12" font-family="sans-serif" font-size="12" fill="#222">Rot-Achse (P₁↔P₂)</text>
    <rect width="20" height="3" y="22" x="180" fill="#00aa00"/>
    <text x="208" y="28" font-family="sans-serif" font-size="12" fill="#222">Grün-Achse (P₃↔P₄)</text>
    <rect width="20" height="3" y="38" x="380" fill="#0066ff"/>
    <text x="408" y="44" font-family="sans-serif" font-size="12" fill="#222">Blau-Achse (P₅↔P₆)</text>
    <text x="0" y="44" font-family="sans-serif" font-size="11" font-style="italic" fill="#666">Tetraeder-Kanten gestrichelt</text>
  </g>
</svg>
