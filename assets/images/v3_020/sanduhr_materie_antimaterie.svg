<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <title>Sanduhr-Geometrie: Materie- und Antimaterie-Tetraeder mit gemeinsamer Spitze</title>

  <!-- Hintergrund -->
  <rect width="600" height="700" fill="#fafafa"/>

  <!-- Titel -->
  <text x="300" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#222">Sanduhr-Geometrie: Materie / Antimaterie</text>
  <text x="300" y="62" text-anchor="middle" font-family="serif" font-size="13" fill="#555">Beide Tetraeder treffen sich mit ihren Spitzen am Ursprung — der Mitte der Sanduhr</text>

  <!-- ===== OBERER TETRAEDER (MATERIE) ===== -->
  <!-- Basis-Triangle oben (P1 P3 P5) -->
  <!-- Drei oben "schwebende" Eckpunkte -->
  <!-- Tetraeder-Kanten (gerade Linien — Franz' Beobachtung "es gibt nur Geraden") -->

  <!-- Materie-Hintergrund-Halo -->
  <ellipse cx="300" cy="200" rx="200" ry="20" fill="#e8f5e9" opacity="0.5"/>

  <!-- Vertices oben -->
  <!-- P5 oben mitte (z+) -->
  <line x1="200" y1="170" x2="400" y2="170" stroke="#222" stroke-width="2"/>
  <line x1="200" y1="170" x2="300" y2="115" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="170" x2="300" y2="115" stroke="#222" stroke-width="2"/>
  <!-- Spitze nach unten (gemeinsamer Ursprung in der Mitte) -->
  <line x1="200" y1="170" x2="300" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="170" x2="300" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="115" x2="300" y2="350" stroke="#222" stroke-width="2"/>

  <!-- Vertices visualisieren -->
  <circle cx="300" cy="115" r="13" fill="#0066ff" stroke="#003a99" stroke-width="2"/>
  <text x="320" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#003a99">P₅ Blau (+z)</text>

  <circle cx="200" cy="170" r="13" fill="#cc0000" stroke="#660000" stroke-width="2"/>
  <text x="80" y="174" font-family="sans-serif" font-size="14" font-weight="bold" fill="#660000">P₁ Rot (+x)</text>

  <circle cx="400" cy="170" r="13" fill="#00aa00" stroke="#003a00" stroke-width="2"/>
  <text x="420" y="174" font-family="sans-serif" font-size="14" font-weight="bold" fill="#003a00">P₃ Grün (+y)</text>

  <!-- Label oben -->
  <text x="300" y="90" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#155724">MATERIE-Tetraeder (positive Achsen)</text>

  <!-- ===== GEMEINSAME SPITZE (URSPRUNG) IN DER MITTE ===== -->
  <circle cx="300" cy="350" r="10" fill="#000"/>
  <text x="320" y="345" font-family="serif" font-size="15" font-weight="bold" fill="#000">o = (0, 0, 0)</text>
  <text x="320" y="362" font-family="serif" font-size="11" font-style="italic" fill="#555">Materie/Antimaterie-Schnittpunkt</text>
  <text x="60" y="358" font-family="serif" font-size="14" font-style="italic" fill="#555">Mitte der Sanduhr</text>

  <!-- Doppelpfeile zur Hervorhebung der Schnittstelle -->
  <line x1="220" y1="350" x2="280" y2="350" stroke="#666" stroke-width="1.5" marker-end="url(#arrow1)" marker-start="url(#arrow1r)"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrow1r" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- ===== UNTERER TETRAEDER (ANTIMATERIE) — gespiegelt ===== -->
  <!-- Antimaterie-Hintergrund-Halo -->
  <ellipse cx="300" cy="500" rx="200" ry="20" fill="#fce4ec" opacity="0.5"/>

  <!-- Spitze nach oben gemeinsam mit Ursprung -->
  <line x1="200" y1="530" x2="400" y2="530" stroke="#222" stroke-width="2"/>
  <line x1="200" y1="530" x2="300" y2="585" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="530" x2="300" y2="585" stroke="#222" stroke-width="2"/>
  <!-- Spitze nach oben (gemeinsamer Ursprung) -->
  <line x1="200" y1="530" x2="300" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="530" x2="300" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="585" x2="300" y2="350" stroke="#222" stroke-width="2"/>

  <!-- Vertices unten (Anti-Farben, etwas heller) -->
  <circle cx="300" cy="585" r="13" fill="#aaccff" stroke="#0066ff" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="320" y="595" font-family="sans-serif" font-size="14" fill="#0066ff">P₆ Anti-Blau (−z)</text>

  <circle cx="200" cy="530" r="13" fill="#ffaaaa" stroke="#cc0000" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="80" y="534" font-family="sans-serif" font-size="14" fill="#cc0000">P₂ Anti-Rot (−x)</text>

  <circle cx="400" cy="530" r="13" fill="#aaeeaa" stroke="#00aa00" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="420" y="534" font-family="sans-serif" font-size="14" fill="#00aa00">P₄ Anti-Grün (−y)</text>

  <!-- Label unten -->
  <text x="300" y="615" text-anchor="middle" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#880e4f">ANTIMATERIE-Tetraeder (negative Achsen)</text>

  <!-- Footer -->
  <text x="300" y="650" text-anchor="middle" font-family="serif" font-size="12" fill="#666">Beide Tetraeder bestehen ausschließlich aus geraden Kanten.</text>
  <text x="300" y="668" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#666">Die Materie-Antimaterie-Symmetrie ist hier rein geometrisch — kein separates Postulat.</text>
</svg>
