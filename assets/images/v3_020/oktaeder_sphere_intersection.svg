<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Oktaeder = Einheitssphäre ∩ kartesische Achsen</title>
  <defs>
    <linearGradient id="materie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#cce5ff"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="600" height="600" fill="#fafafa"/>

  <!-- Sphäre als Hilfskreis (perspektivisch) -->
  <ellipse cx="300" cy="300" rx="200" ry="80" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,3"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Achsen (3D-projiziert) -->
  <line x1="300" y1="80" x2="300" y2="520" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="80" y1="300" x2="520" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="160" y1="380" x2="440" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Oktaeder-Kanten (alle sichtbar) -->
  <!-- Vorderseite (durchgezogen) -->
  <line x1="300" y1="100" x2="500" y2="300" stroke="#222" stroke-width="2.2"/>
  <line x1="300" y1="100" x2="100" y2="300" stroke="#222" stroke-width="2.2"/>
  <line x1="300" y1="100" x2="420" y2="240" stroke="#222" stroke-width="2.2"/>
  <line x1="300" y1="100" x2="180" y2="360" stroke="#222" stroke-width="2.2"/>
  <line x1="500" y1="300" x2="420" y2="240" stroke="#222" stroke-width="2.2"/>
  <line x1="500" y1="300" x2="300" y2="500" stroke="#222" stroke-width="2.2"/>
  <line x1="100" y1="300" x2="180" y2="360" stroke="#222" stroke-width="2.2"/>
  <line x1="100" y1="300" x2="300" y2="500" stroke="#222" stroke-width="2.2"/>
  <!-- Hintere Kanten (gestrichelt für Tiefenwirkung) -->
  <line x1="300" y1="500" x2="420" y2="240" stroke="#222" stroke-width="2.2" stroke-dasharray="6,3"/>
  <line x1="300" y1="500" x2="180" y2="360" stroke="#222" stroke-width="2.2" stroke-dasharray="6,3"/>
  <line x1="100" y1="300" x2="420" y2="240" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="300" x2="180" y2="360" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Ursprung -->
  <circle cx="300" cy="300" r="6" fill="#333"/>
  <text x="312" y="296" font-family="serif" font-size="14" fill="#333">o (0,0,0)</text>

  <!-- Vertices mit Farben -->
  <!-- P5 oben (z+) blau -->
  <circle cx="300" cy="100" r="14" fill="#0066ff" stroke="#003a99" stroke-width="2"/>
  <text x="320" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#003a99">P₅ = (0, 0, +L₀) — Blau (+z)</text>

  <!-- P6 unten (z-) blau-anti -->
  <circle cx="300" cy="500" r="14" fill="#aaccff" stroke="#0066ff" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="320" y="514" font-family="sans-serif" font-size="14" fill="#0066ff">P₆ = (0, 0, −L₀) — Anti-Blau (−z)</text>

  <!-- P1 rechts (x+) rot -->
  <circle cx="500" cy="300" r="14" fill="#cc0000" stroke="#660000" stroke-width="2"/>
  <text x="520" y="296" font-family="sans-serif" font-size="16" font-weight="bold" fill="#660000">P₁ — Rot (+x)</text>
  <text x="520" y="312" font-family="sans-serif" font-size="11" fill="#660000">(+L₀, 0, 0)</text>

  <!-- P2 links (x-) anti-rot -->
  <circle cx="100" cy="300" r="14" fill="#ffaaaa" stroke="#cc0000" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="14" y="296" font-family="sans-serif" font-size="14" fill="#cc0000">P₂ — Anti-Rot (−x)</text>

  <!-- P3 hinten (y+) grün - perspektivisch oben rechts -->
  <circle cx="420" cy="240" r="14" fill="#00aa00" stroke="#003a00" stroke-width="2"/>
  <text x="432" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#003a00">P₃ — Grün (+y)</text>
  <text x="432" y="252" font-family="sans-serif" font-size="11" fill="#003a00">(0, +L₀, 0)</text>

  <!-- P4 vorne (y-) anti-grün - perspektivisch unten links -->
  <circle cx="180" cy="360" r="14" fill="#aaeeaa" stroke="#00aa00" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="40" y="380" font-family="sans-serif" font-size="14" fill="#00aa00">P₄ — Anti-Grün (−y)</text>

  <!-- Titel und Legende -->
  <text x="300" y="40" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#222">Oktaeder als Sphäre ∩ Raummatrix-Achsen</text>
  <text x="300" y="62" text-anchor="middle" font-family="serif" font-size="13" fill="#555">6 Schnittpunkte mit Achsen → Materie + Antimaterie-Farbladungen</text>

  <text x="300" y="560" text-anchor="middle" font-family="serif" font-size="12" fill="#666">durchgezogen: Vorderseite — gestrichelt: Hinterseite (Tiefenwirkung)</text>
  <text x="300" y="578" text-anchor="middle" font-family="serif" font-size="12" font-style="italic" fill="#666">Alle Kanten Länge = L₀√2 — Sphäre als Hilfskreis</text>
</svg>
